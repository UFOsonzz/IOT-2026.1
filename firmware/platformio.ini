; ============================================================================
; Cấu hình PlatformIO cho ESP32-S3-WROOM-1-N16R8 (16MB Quad Flash + 8MB Octal PSRAM)
; Hệ thống Giám sát Vi khí hậu Kho lạnh & Xe tải Đông lạnh tuân thủ GSP
; ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Thiết lập bộ nhớ chuẩn cho module N16R8 (16MB QIO Flash + 8MB OPI PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

; Cờ biên dịch kích hoạt PSRAM và cấu hình kích thước gói tin MQTT tối đa
build_flags =
    -DBOARD_HAS_PSRAM
    -DMQTT_MAX_PACKET_SIZE=1024
    -DCORE_DEBUG_LEVEL=3

; Tốc độ cổng Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Thư viện phụ thuộc
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0