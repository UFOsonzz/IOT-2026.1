; ============================================================================
; CẤU HÌNH PHẦN CỨNG GSP
;   1. Đổi chip:     "default_envs = esp32dev"  <--->  "default_envs = esp32s3"
;   2. Đổi cảm biến: "-D SENSOR_TYPE_SHT40"     <--->  "-D SENSOR_TYPE_SHT30"
; ============================================================================
[platformio]
default_envs = esp32dev

; Cấu hình nền tảng dùng chung
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder, time

; CHỌN LOẠI CẢM BIẾN
build_flags =
    -D SENSOR_TYPE_SHT40   ; Đổi thành -D SENSOR_TYPE_SHT30 nếu dùng SHT30

lib_deps =
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3
    olikraus/U8g2@2.36.18

; ----------------------------------------------------------------------------
; ESP32 Classic (ESP32-WROOM-32 DevKit v1)
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
build_flags =
    ${env.build_flags}

; ----------------------------------------------------------------------------
; ESP32-S3 (ESP32-S3 DevKitC-1)
; ----------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_S3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
