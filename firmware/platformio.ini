; ============================================================================
; Cấu hình PlatformIO cho ESP32-S3-WROOM-1-N16R8 (16MB Quad Flash + 8MB Octal PSRAM)
; Hệ thống IoT Giám sát chuỗi cung ứng lạnh tuân thủ GSP
; ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Thiết lập bộ nhớ cho module N16R8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

; Tốc độ cổng Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Cờ biên dịch bắt buộc cho ESP32-S3 USB CDC + PSRAM + gói tin MQTT
build_flags =
    -DBOARD_HAS_PSRAM
    -DMQTT_MAX_PACKET_SIZE=1024
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=1

; Thư viện phụ thuộc tự động tải
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0