# =========================================================================
# Cấu hình Eclipse Mosquitto 2.x cho Hệ thống GSP Cold Chain IoT
# Phục vụ bản chạy thông ban đầu
# =========================================================================

# Mở cổng lắng nghe MQTT tiêu chuẩn trên toàn bộ giao diện mạng
listener 1883 0.0.0.0

# Cho phép kết nối ẩn danh trong mạng Docker nội bộ (Bản chạy thông MVP)
allow_anonymous true

# Bật lưu trữ bền vững (Persistence) để bảo toàn hàng đợi QoS 1
# và trạng thái Retain (status ONLINE/OFFLINE) khi khởi động lại Broker
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Cấu hình ghi nhận nhật ký (Logging) ra stdout để theo dõi qua Docker logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Tối ưu hóa hàng đợi cho luồng Auto-Sync từ thẻ MicroSD
max_queued_messages 10000
max_inflight_messages 100